<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12002b"/>
      <stop offset="0.7" stop-color="#3a0a52"/>
      <stop offset="1" stop-color="#5a1060"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45e"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="900" height="280" fill="#fff"/>
      <rect x="0" y="140" width="900" height="3" fill="#000"/>
      <rect x="0" y="155" width="900" height="4" fill="#000"/>
      <rect x="0" y="170" width="900" height="5" fill="#000"/>
      <rect x="0" y="184" width="900" height="6" fill="#000"/>
      <rect x="0" y="198" width="900" height="7" fill="#000"/>
    </mask>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="280" rx="18"/></clipPath>
    <clipPath id="floor"><rect x="0" y="200" width="900" height="80"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- Soleil -->
    <g mask="url(#stripes)">
      <circle cx="450" cy="140" r="72" fill="url(#sun)" filter="url(#glow)">
        <animate attributeName="r" values="72;75;72" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Sol -->
    <rect x="0" y="200" width="900" height="80" fill="#14012e"/>
    <g clip-path="url(#floor)" stroke="#ff2e93" stroke-width="1.5" fill="none">
      <g stroke-opacity="0.55"><line x1="450" y1="200" x2="-500" y2="280"/><line x1="450" y1="200" x2="-400" y2="280"/><line x1="450" y1="200" x2="-300" y2="280"/><line x1="450" y1="200" x2="-200" y2="280"/><line x1="450" y1="200" x2="-100" y2="280"/><line x1="450" y1="200" x2="0" y2="280"/><line x1="450" y1="200" x2="100" y2="280"/><line x1="450" y1="200" x2="200" y2="280"/><line x1="450" y1="200" x2="300" y2="280"/><line x1="450" y1="200" x2="400" y2="280"/><line x1="450" y1="200" x2="500" y2="280"/><line x1="450" y1="200" x2="600" y2="280"/><line x1="450" y1="200" x2="700" y2="280"/><line x1="450" y1="200" x2="800" y2="280"/><line x1="450" y1="200" x2="900" y2="280"/><line x1="450" y1="200" x2="1000" y2="280"/><line x1="450" y1="200" x2="1100" y2="280"/><line x1="450" y1="200" x2="1200" y2="280"/><line x1="450" y1="200" x2="1300" y2="280"/><line x1="450" y1="200" x2="1400" y2="280"/></g>
      <line x1="0" x2="900" y1="200" y2="200" stroke-opacity="0">
      <animate attributeName="y1" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" begin="0.0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="900" y1="200" y2="200" stroke-opacity="0">
      <animate attributeName="y1" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="900" y1="200" y2="200" stroke-opacity="0">
      <animate attributeName="y1" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" begin="1.0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="900" y1="200" y2="200" stroke-opacity="0">
      <animate attributeName="y1" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="900" y1="200" y2="200" stroke-opacity="0">
      <animate attributeName="y1" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" begin="2.0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="900" y1="200" y2="200" stroke-opacity="0">
      <animate attributeName="y1" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200;280" keyTimes="0;1" calcMode="spline" keySplines=".6 0 1 .8" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </line>
    
    </g>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- HUD -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#00f0ff">
    <text x="30" y="40">1UP
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></text>
    <text x="870" y="40" text-anchor="end">HI-SCORE 999999</text>
  </g>

  <!-- Titre avec glitch -->
  <g font-family="Verdana, Arial, sans-serif" font-weight="bold" font-size="72" text-anchor="middle">
    <text x="450" y="152" fill="#00f0ff" fill-opacity="0.8">SKYFOX
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 1;3 -1;0 0;0 0" keyTimes="0;0.85;0.88;0.92;0.95;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="450" y="152" fill="#ff2e93" fill-opacity="0.8">SKYFOX
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 -1;-3 1;0 0;0 0" keyTimes="0;0.85;0.88;0.92;0.95;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="450" y="152" fill="#ffffff" filter="url(#glow)">SKYFOX</text>
  </g>

  <text x="450" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#ffe45e" letter-spacing="2">Gamer · Builder · Explorer</text>

  <text x="450" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#fff" letter-spacing="6" filter="url(#glow)">&gt; PRESS START
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.6;1" dur="1.2s" repeatCount="indefinite"/></text>

  <!-- Scanlines CRT -->
  <rect width="900" height="280" rx="18" fill="url(#scan)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="18" fill="none" stroke="#ff2e93" stroke-opacity="0.4"/>
</svg>
